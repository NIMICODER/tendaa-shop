services:
  postgres:
    image: postgres:16
    container_name: tendaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tendaa
      POSTGRES_USER: tendaa
      POSTGRES_PASSWORD: tendaa_dev
    ports:
      # Host port 5433, not 5432: this machine also runs a native PostgreSQL 16 Windows service
      # on 5432 (IPv4), which `localhost` resolves to ahead of Docker's IPv6 listener — connecting
      # to "localhost:5432" silently hit the wrong Postgres instead of this container.
      - "5433:5432"
    volumes:
      - tendaa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tendaa -d tendaa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tendaa-postgres-data:
